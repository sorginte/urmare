# Deterministic benchmark-only configuration for Apache Airflow 3.3.1.
# The upstream monorepo has independent package roots; the duplicate namespace
# initializer in task-sdk is excluded so one canonical `airflow` module remains.
[tool.urmare]
source-roots = [
    "airflow-core/src",
    "airflow-ctl/src",
    "task-sdk/src",
    "devel-common/src",
    "shared/configuration/src",
    "shared/dagnode/src",
    "shared/listeners/src",
    "shared/logging/src",
    "shared/module_loading/src",
    "shared/observability/src",
    "shared/plugins_manager/src",
    "shared/providers_discovery/src",
    "shared/secrets_backend/src",
    "shared/secrets_masker/src",
    "shared/serialization/src",
    "shared/state/src",
    "shared/template_rendering/src",
    "shared/timezones/src",
]
test-roots = [
    "airflow-core/tests",
    "airflow-ctl/tests",
    "airflow-ctl-tests/tests",
    "devel-common/tests",
    "task-sdk/tests",
    "task-sdk-integration-tests/tests",
    "shared/configuration/tests",
    "shared/dagnode/tests",
    "shared/listeners/tests",
    "shared/logging/tests",
    "shared/module_loading/tests",
    "shared/observability/tests",
    "shared/plugins_manager/tests",
    "shared/providers_discovery/tests",
    "shared/secrets_backend/tests",
    "shared/secrets_masker/tests",
    "shared/serialization/tests",
    "shared/state/tests",
    "shared/template_rendering/tests",
    "shared/timezones/tests",
]
exclude = [
    "task-sdk/src/airflow/__init__.py",
    "providers/**",
    "dev/**",
    "scripts/**",
    "chart/**",
    "airflow-e2e-tests/**",
    "docker-tests/**",
    "kubernetes-tests/**",
    "performance/**",
    "clients/**",
    "docs/**",
    "docker-stack-docs/**",
    "providers-summary-docs/**",
    "generated/**",
    "java-sdk/**",
    "go-sdk/**",
]
