[workspace]
members = [
    "crates/urmare-cli",
    "crates/urmare-core",
    "crates/urmare-graph",
    "crates/urmare-python",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
authors = ["Sorginte"]
license = "MIT"
repository = "https://github.com/sorginte/urmare"

[workspace.dependencies]
blake3 = { version = "1.8", features = ["pure"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
globset = "0.4.19"
redb = "4.2"
ruff_python_ast = "0.0.7"
ruff_python_parser = "0.0.7"
ruff_source_file = "0.0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
walkdir = "2.5"
