[workspace]
members = [
    "crates/urmare-app",
    "crates/urmare-cli",
    "crates/urmare-contract",
    "crates/urmare-core",
    "crates/urmare-graph",
    "crates/urmare-mcp",
    "crates/urmare-python",
]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
authors = ["Sorginte"]
license = "MIT"
repository = "https://github.com/sorginte/urmare"

[workspace.dependencies]
blake3 = { version = "1.8", features = ["pure"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
globset = "0.4.19"
redb = "4.2"
rmcp = { version = "3.4", default-features = false, features = ["server", "transport-io"] }
ruff_python_ast = "0.0.7"
ruff_python_parser = "0.0.7"
ruff_source_file = "0.0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.1"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-std", "io-util", "rt", "sync"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
walkdir = "2.5"
