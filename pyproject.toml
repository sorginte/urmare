[build-system]
requires = ["maturin>=1.14.1,<2.0"]
build-backend = "maturin"

[project]
name = "urmare"
dynamic = ["version"]
description = "High-performance dependency and impact analysis for Python repositories"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Sorginte" },
]
keywords = ["dependency-graph", "impact-analysis", "python", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/sorginte/urmare"
Repository = "https://github.com/sorginte/urmare"
Issues = "https://github.com/sorginte/urmare/issues"
Releases = "https://github.com/sorginte/urmare/releases"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/urmare-cli/Cargo.toml"
strip = true
