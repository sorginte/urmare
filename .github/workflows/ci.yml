name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Run Clippy
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo +stable test --workspace --locked

      - name: Test packaging contract
        run: python3 -m unittest discover -s tests/packaging -v

      - name: Test real-project benchmark infrastructure offline
        run: python3 -m unittest discover -s tests/benchmarks -p 'test_*.py' -v

      - name: Build release binary
        run: cargo +stable build --release --locked -p urmare-cli

  portability:
    name: Test and build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: macOS ARM64
            os: macos-latest
          - name: macOS x86_64
            os: macos-15-intel
          - name: Windows x86_64
            os: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Run tests
        run: cargo +stable test --workspace --locked

      - name: Build release binary
        run: cargo +stable build --release --locked -p urmare-cli

  msrv:
    name: Minimum Rust 1.95
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust 1.95
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Check all targets
        run: cargo +1.95.0 check --workspace --all-targets --locked

  workflow-security:
    name: Workflow syntax and security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Validate workflow syntax and schemas
        uses: raven-actions/actionlint@e01d1ea33dd6a5ed517d95b4c0c357560ac6f518 # v2.1.1
        with:
          version: "1.7.12"
          cache: false
          pyflakes: false

      - name: Audit workflow security
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: "1.29.0"
          advanced-security: false
          annotations: true
          online-audits: false

  required:
    name: Required
    if: ${{ always() }}
    needs:
      - quality
      - portability
      - msrv
      - workflow-security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required jobs
        if: ${{ needs.quality.result != 'success' || needs.portability.result != 'success' || needs.msrv.result != 'success' || needs.workflow-security.result != 'success' }}
        run: exit 1

      - name: Confirm success
        run: echo "All required CI jobs passed."
