name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.metadata.outputs.release-tag }}
      version: ${{ steps.metadata.outputs.version }}
      commit_sha: ${{ steps.metadata.outputs.commit-sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and Cargo workspace version
        id: metadata
        shell: bash
        run: |
          actual_commit="$(git rev-parse HEAD)"
          if [[ "$actual_commit" != "$GITHUB_SHA" ]]; then
            echo "Checked-out commit '$actual_commit' does not match tag commit '$GITHUB_SHA'." >&2
            exit 1
          fi
          python3 scripts/release_artifacts.py metadata \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify release commit is on main
        shell: bash
        run: |
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "Could not find origin/main in the fetched repository." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "Release tag '$GITHUB_REF_NAME' must point to a commit on main." >&2
            exit 1
          fi

  build:
    name: Build verified distributions
    needs: validate
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/build-binaries.yml
    with:
      release_tag: ${{ needs.validate.outputs.release_tag }}
      version: ${{ needs.validate.outputs.version }}
      commit_sha: ${{ needs.validate.outputs.commit_sha }}

  attest-wheels:
    name: Attest PyPI wheels
    needs:
      - validate
      - build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download only wheel channels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist/wheels
          merge-multiple: true

      - name: Attest wheel build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: dist/wheels/*.whl

  publish-draft:
    name: Create draft GitHub Release
    needs:
      - validate
      - build
      - attest-wheels
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false

      - name: Download only standalone archive channels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archives-*
          path: dist/release
          merge-multiple: true

      - name: Verify public assets and generate checksums
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          python3 scripts/release_artifacts.py prepare-release-assets \
            --archives-dir dist/release \
            --tag "$RELEASE_TAG"
          cd dist/release
          sha256sum --check SHA256SUMS

      - name: Attest GitHub Release assets
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/release/*.tar.gz
            dist/release/*.zip
            dist/release/SHA256SUMS

      - name: Create or update draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          if release_is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            if [[ "$release_is_draft" != "true" ]]; then
              echo "Release '$RELEASE_TAG' is already published; refusing to replace its assets." >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --draft \
              --generate-notes \
              --title "Urmare $RELEASE_VERSION" \
              --verify-tag
          fi

          gh release upload "$RELEASE_TAG" \
            dist/release/*.tar.gz \
            dist/release/*.zip \
            dist/release/SHA256SUMS \
            --clobber

  publish-pypi:
    name: Publish wheels to PyPI
    needs:
      - validate
      - publish-draft
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/urmare/${{ needs.validate.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Download only verified wheel channels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish exact wheels with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          attestations: true
          print-hash: true
